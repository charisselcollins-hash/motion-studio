<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>S.H.E. BUILDS™ brand check</title>
<link rel="stylesheet" href="../brand.css">
<style>
  #stage {
    position: relative;
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    box-sizing: border-box;
    padding: 110px 90px 0;
  }
  #glow {
    position: absolute;
    width: 1500px;
    height: 1500px;
    left: -210px;
    top: -700px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--color-muted) 22%, transparent), transparent 62%);
  }
  .label {
    font-family: var(--font-body);
    font-weight: var(--font-body-weight);
    font-size: 24px;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--color-muted);
  }

  /* Header */
  header { position: relative; text-align: center; }
  #wordmark {
    margin: 26px 0 0;
    font-size: 112px;
    line-height: 1;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  #wordmark span { display: inline-block; }
  #wordmark .tm { font-size: 0.32em; vertical-align: top; margin-left: 6px; margin-top: 8px; }
  #tagline {
    margin-top: 26px;
    font-family: var(--font-decorative);
    font-weight: var(--font-decorative-weight);
    font-size: 60px;
    color: var(--color-text);
  }
  .rule {
    height: 4px;
    margin: 56px auto 0;
    width: 100%;
    background: linear-gradient(90deg, transparent, var(--color-accent) 20%, var(--color-accent) 80%, transparent);
  }

  /* Swatches */
  section { position: relative; margin-top: 50px; }
  section .label { margin-bottom: 28px; }
  #swatches {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 28px;
  }
  .card {
    background: var(--color-surface);
    border-radius: 28px;
    padding: 20px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
  }
  .chip {
    height: 120px;
    border-radius: 18px;
    box-shadow: inset 0 0 0 2px rgba(255, 249, 240, 0.18);
  }
  .card .name { margin-top: 20px; font-size: 32px; color: var(--color-text); }
  .card .hex { margin-top: 6px; font-size: 26px; color: var(--color-muted); letter-spacing: 2px; }

  /* Typography */
  .type-row { padding: 22px 0; border-bottom: 2px solid rgba(168, 182, 197, 0.2); }
  .type-row:last-child { border-bottom: 0; }
  .type-row .label { font-size: 20px; letter-spacing: 5px; margin-bottom: 14px; }
  .type-row .label b { color: var(--color-accent); font-weight: inherit; }
  #sample-display { font-family: var(--font-display); font-weight: var(--font-display-weight); font-size: 84px; line-height: 1.05; }
  #sample-body { font-family: var(--font-body); font-weight: var(--font-body-weight); font-size: 36px; line-height: 1.4; color: var(--color-text); }
  #sample-deco { font-family: var(--font-decorative); font-weight: var(--font-decorative-weight); font-size: 76px; line-height: 1.05; color: var(--color-accent); }

  footer {
    position: absolute;
    left: 0; right: 0; bottom: 70px;
    text-align: center;
    font-size: 20px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>

  <header>
    <div class="label" id="kicker">Brand Check</div>
    <h1 id="wordmark"></h1>
    <div id="tagline">Brand identity guide</div>
    <div class="rule" id="rule"></div>
  </header>

  <section>
    <div class="label" id="color-label">Color</div>
    <div id="swatches"></div>
  </section>

  <section>
    <div class="label" id="type-label">Typography</div>
    <div class="type-row">
      <div class="label"><b>Headline</b> · Montserrat ExtraBold 800</div>
      <div id="sample-display">She Builds Boldly</div>
    </div>
    <div class="type-row">
      <div class="label"><b>Body</b> · Montserrat SemiBold 600</div>
      <div id="sample-body">Clear, confident body text for captions and supporting copy.</div>
    </div>
    <div class="type-row">
      <div class="label"><b>Decorative</b> · Cormorant Garamond SemiBold 600</div>
      <div id="sample-deco">Elegance in every detail</div>
    </div>
  </section>

  <footer class="label" id="footer">brand.css · 1080 × 1920</footer>
</div>

<script>
  window.DURATION = 5;
  window.SIZE = [1080, 1920];

  // ---- Helpers (plain math, no timers) ----
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const easeOutCubic = (x) => 1 - (1 - x) ** 3;
  const easeInOutCubic = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
  const easeOutBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
  const progress = (t, start, dur, ease = (x) => x) => ease(clamp((t - start) / dur));
  const $ = (id) => document.getElementById(id);

  // ---- Build elements ----
  const wordmark = $('wordmark');
  const chars = [...'S.H.E. BUILDS'].map((c) => {
    const s = document.createElement('span');
    s.textContent = c === ' ' ? ' ' : c;
    wordmark.appendChild(s);
    return s;
  });
  const tm = document.createElement('span');
  tm.className = 'tm';
  tm.textContent = '™';
  wordmark.appendChild(tm);
  chars.push(tm);

  const COLORS = [
    { name: 'Navy', hex: '#163A5F', role: 'Background' },
    { name: 'Gold', hex: '#D4AF37', role: 'Accent' },
    { name: 'Warm White', hex: '#FFF9F0', role: 'Text' },
    { name: 'Mist', hex: '#A8B6C5', role: 'Muted' },
  ];
  const cards = COLORS.map((c) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="chip" style="background:${c.hex}"></div>
      <div class="name">${c.role}</div><div class="hex">${c.hex}</div>`;
    $('swatches').appendChild(card);
    return { card, chip: card.querySelector('.chip') };
  });
  const typeRows = [...document.querySelectorAll('.type-row')];

  const GOLD = getComputedStyle(document.documentElement).getPropertyValue('--color-accent').trim();
  const fadeUp = (el, p, dist = 40) => {
    el.style.opacity = clamp(p);
    el.style.transform = `translateY(${(1 - p) * dist}px)`;
  };

  // ---- Draw the frame at time t ----
  window.render = function (t) {
    $('glow').style.opacity = progress(t, 0, 1.2, easeOutCubic);
    $('glow').style.transform = `translateX(${Math.sin(t * 0.9) * 50}px)`;

    // Header: kicker, then the wordmark letter by letter, then tagline + rule.
    fadeUp($('kicker'), progress(t, 0.05, 0.5, easeOutCubic), 20);

    // Gold shimmer travels across the wordmark from 3.4s to 4.6s.
    const shimmer = -3 + progress(t, 3.4, 1.2, easeInOutCubic) * (chars.length + 6);
    chars.forEach((el, i) => {
      const p = progress(t, 0.15 + i * 0.035, 0.55, easeOutBack);
      el.style.opacity = progress(t, 0.15 + i * 0.035, 0.25);
      el.style.transform = `translateY(${(1 - p) * 70}px)`;
      const glow = Math.max(0, 1 - Math.abs(i - shimmer) / 2.5);
      el.style.color = `color-mix(in srgb, #FFF4C9 ${Math.round(glow * 85)}%, ${GOLD})`;
    });

    fadeUp($('tagline'), progress(t, 0.7, 0.6, easeOutCubic), 24);
    $('rule').style.transform = `scaleX(${progress(t, 0.85, 0.7, easeInOutCubic)})`;

    // Color swatches pop in one after another; each chip fills from the bottom.
    fadeUp($('color-label'), progress(t, 1.0, 0.4, easeOutCubic), 16);
    cards.forEach(({ card, chip }, i) => {
      const start = 1.1 + i * 0.14;
      const p = progress(t, start, 0.6, easeOutBack);
      card.style.opacity = progress(t, start, 0.3);
      card.style.transform = `translateY(${(1 - p) * 50}px) scale(${0.92 + 0.08 * p})`;
      const fill = progress(t, start + 0.15, 0.5, easeInOutCubic);
      chip.style.clipPath = `inset(${(1 - fill) * 100}% 0 0 0 round 18px)`;
    });

    // Typography rows slide in from the left.
    fadeUp($('type-label'), progress(t, 2.1, 0.4, easeOutCubic), 16);
    typeRows.forEach((row, i) => {
      const p = progress(t, 2.25 + i * 0.22, 0.7, easeOutCubic);
      row.style.opacity = p;
      row.style.transform = `translateX(${(1 - p) * -60}px)`;
    });

    $('footer').style.opacity = progress(t, 3.0, 0.6);
  };

  window.render(0);
</script>
</body>
</html>
