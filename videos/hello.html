<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hello from my studio</title>
<link rel="stylesheet" href="../brand.css">
<style>
  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
  }
  #glow {
    position: absolute;
    width: 1400px;
    height: 1400px;
    left: 260px;
    top: -160px;
    border-radius: 50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--color-primary) 35%, transparent), transparent 65%);
  }
  #content {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: 140px;
    font-weight: 800;
    letter-spacing: -3px;
    display: flex;
    gap: 0.28em;
  }
  h1 span { display: inline-block; }
  h1 span:last-child { color: var(--color-accent); }
  #bar {
    margin-top: 48px;
    width: 640px;
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
    transform-origin: left center;
  }
  #label {
    margin-top: 40px;
    font-size: 30px;
    font-weight: 500;
    color: var(--color-muted);
    text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <div id="content">
    <h1 id="title"></h1>
    <div id="bar"></div>
    <div id="label">Motion Studio</div>
  </div>
</div>

<script>
  window.DURATION = 3;
  window.SIZE = [1920, 1080];

  // Helpers: plain math, no timers.
  const clamp = (x) => Math.min(1, Math.max(0, x));
  const easeOutCubic = (x) => 1 - (1 - x) ** 3;
  const easeInOutCubic = (x) => (x < 0.5 ? 4 * x ** 3 : 1 - (-2 * x + 2) ** 3 / 2);
  const easeOutBack = (x) => 1 + 2.70158 * (x - 1) ** 3 + 1.70158 * (x - 1) ** 2;
  // 0→1 progress of an animation starting at `start` seconds, lasting `dur`.
  const progress = (t, start, dur, ease = (x) => x) => ease(clamp((t - start) / dur));

  const title = document.getElementById('title');
  const words = 'Hello from my studio'.split(' ').map((w) => {
    const span = document.createElement('span');
    span.textContent = w;
    title.appendChild(span);
    return span;
  });
  const bar = document.getElementById('bar');
  const label = document.getElementById('label');
  const glow = document.getElementById('glow');

  // Draw the exact frame at time t (seconds).
  window.render = function (t) {
    // Fade everything out over the last 0.35s.
    const out = 1 - progress(t, DURATION - 0.35, 0.35, easeInOutCubic);
    document.getElementById('content').style.opacity = out;

    // Background glow drifts slowly.
    glow.style.transform = `translate(${Math.sin(t * 1.2) * 60}px, ${Math.cos(t) * 30}px)`;
    glow.style.opacity = progress(t, 0, 0.8, easeOutCubic) * out;

    // Words rise in one after another.
    words.forEach((el, i) => {
      const p = progress(t, 0.15 + i * 0.12, 0.7, easeOutBack);
      const fade = progress(t, 0.15 + i * 0.12, 0.35);
      el.style.transform = `translateY(${(1 - p) * 80}px)`;
      el.style.opacity = fade;
    });

    // Bar sweeps across.
    bar.style.transform = `scaleX(${progress(t, 0.8, 0.7, easeInOutCubic)})`;

    // Label fades in while its letter spacing tightens.
    const l = progress(t, 1.1, 0.8, easeOutCubic);
    label.style.opacity = l;
    label.style.letterSpacing = `${18 - 10 * l}px`;
  };

  window.render(0);
</script>
</body>
</html>
