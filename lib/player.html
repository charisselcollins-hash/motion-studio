<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Motion Studio</title>
<style>
  :root { --bg: #111114; --panel: #1b1b20; --text: #e8e8ee; --muted: #8b8b96; --accent: #7c5cff; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 Inter, system-ui, sans-serif; }
  body.render { background: transparent; }
  body.render #ui, body.render #picker { display: none; }
  body.render canvas { display: block; }
  #stage { display: flex; justify-content: center; padding: 16px; }
  body:not(.render) canvas { max-width: 100%; max-height: calc(100vh - 140px); height: auto; box-shadow: 0 10px 40px #0008; }
  #ui { display: flex; align-items: center; gap: 12px; padding: 0 16px 16px; max-width: 1200px; margin: 0 auto; }
  #ui button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font: inherit; cursor: pointer; min-width: 72px; }
  #ui input[type=range] { flex: 1; accent-color: var(--accent); }
  #time { font-variant-numeric: tabular-nums; color: var(--muted); min-width: 150px; text-align: right; }
  #picker { max-width: 600px; margin: 40px auto; padding: 0 16px; }
  #picker a { display: block; padding: 12px 16px; margin: 8px 0; background: var(--panel); color: var(--text); border-radius: 8px; text-decoration: none; }
  #picker a:hover { outline: 1px solid var(--accent); }
  #error { color: #ff6b6b; white-space: pre-wrap; padding: 16px; font-family: monospace; }
</style>
</head>
<body>
<div id="picker" hidden></div>
<div id="stage"><canvas id="c"></canvas></div>
<div id="ui" hidden>
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" value="0" step="1" />
  <span id="time"></span>
</div>
<div id="error"></div>
<script type="module">
const params = new URLSearchParams(location.search);
const name = params.get('scene');
const renderMode = params.has('render');
if (renderMode) document.body.classList.add('render');

const showError = (e) => {
  document.getElementById('error').textContent = String(e?.stack || e);
  window.__error = String(e?.message || e);
};
window.addEventListener('error', (e) => showError(e.error || e.message));

async function listScenes() {
  const res = await fetch('/api/scenes');
  const scenes = await res.json();
  const picker = document.getElementById('picker');
  picker.hidden = false;
  picker.innerHTML = '<h2>Scenes</h2>' + (scenes.length
    ? scenes.map((s) => `<a href="?scene=${encodeURIComponent(s)}">${s}</a>`).join('')
    : '<p>No scenes yet. Run <code>npm run new my-scene</code>.</p>');
  document.getElementById('stage').hidden = true;
}

async function main() {
  if (!name) return listScenes();

  const mod = await import(`/scenes/${name}.js?v=${Date.now()}`);
  const scene = mod.default;
  const width = scene.width ?? 1920;
  const height = scene.height ?? 1080;
  const fps = scene.fps ?? 30;
  const totalFrames = Math.round((scene.duration ?? 5) * fps);
  document.title = `${name} · Motion Studio`;

  const canvas = document.getElementById('c');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');

  await document.fonts.ready;
  const state = (await scene.setup?.({ width, height, fps })) ?? {};
  await document.fonts.ready;

  function draw(frame) {
    const t = frame / fps;
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    if (scene.background) {
      ctx.fillStyle = scene.background;
      ctx.fillRect(0, 0, width, height);
    } else {
      ctx.clearRect(0, 0, width, height);
    }
    scene.render(ctx, t, { width, height, fps, frame, duration: totalFrames / fps, state });
    ctx.restore();
  }

  // Used by scripts/render.mjs
  window.__config = { width, height, fps, totalFrames, audio: scene.audio ?? null };
  window.__draw = draw;
  window.__frame = (frame, type = 'image/png', quality) => {
    draw(frame);
    return canvas.toDataURL(type, quality);
  };

  if (renderMode) { window.__ready = true; return; }

  // ---- Preview controls ----
  const ui = document.getElementById('ui');
  const scrub = document.getElementById('scrub');
  const playBtn = document.getElementById('play');
  const timeEl = document.getElementById('time');
  ui.hidden = false;
  scrub.max = totalFrames - 1;

  let frame = Number(params.get('frame') ?? 0);
  let playing = !params.has('frame');
  let last = performance.now();
  let acc = 0;

  const show = () => {
    draw(frame);
    scrub.value = frame;
    timeEl.textContent = `${(frame / fps).toFixed(2)}s · frame ${frame}/${totalFrames - 1}`;
    playBtn.textContent = playing ? 'Pause' : 'Play';
  };
  playBtn.onclick = () => { playing = !playing; last = performance.now(); show(); };
  scrub.oninput = () => { playing = false; frame = Number(scrub.value); show(); };
  addEventListener('keydown', (e) => {
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    if (e.code === 'ArrowRight') { playing = false; frame = Math.min(totalFrames - 1, frame + 1); show(); }
    if (e.code === 'ArrowLeft') { playing = false; frame = Math.max(0, frame - 1); show(); }
  });

  const tick = (now) => {
    if (playing) {
      acc += now - last;
      const step = 1000 / fps;
      while (acc >= step) { frame = (frame + 1) % totalFrames; acc -= step; }
      show();
    }
    last = now;
    requestAnimationFrame(tick);
  };
  show();
  requestAnimationFrame(tick);
}

main().catch(showError);
</script>
</body>
</html>
